<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Police units · I Heart NYC</title>
  <link rel="icon" type="image/png" href="./assets/favicon.png">
  <link rel="apple-touch-icon" href="./assets/favicon.png">
<style>
@font-face{font-family:Jost;src:url('./assets/fonts/jost.woff2')}@font-face{font-family:Barlow;src:url('./assets/fonts/barlow-condensed-700.woff2');font-weight:700}
*{box-sizing:border-box}body{margin:0;font:16px Jost,system-ui,sans-serif;color:#162b3b;background:#f3f1e9}header{height:66px;border-bottom:1px solid #c0c8c7;display:flex;align-items:center;justify-content:space-between;padding:0 4vw}header a{color:inherit}h1,h2{font-family:Barlow,system-ui,sans-serif;line-height:1;margin:0}h1{font-size:1.8rem}main{display:grid;grid-template-columns:minmax(265px,31%) 1fr;height:calc(100dvh - 66px)}aside{padding:22px 18px 0 3vw;display:flex;flex-direction:column;min-height:0;border-right:1px solid #bbc3c2}label{font-weight:600;font-size:.86rem}input,select,button{font:inherit;color:inherit}input,select{width:100%;margin:4px 0 10px;background:#fcfbf6;border:1px solid #abb7b8;padding:7px 9px;border-radius:2px}#count{font-size:.85rem;margin:3px 0 8px;color:#465b61}nav{overflow:auto;min-height:0;padding-bottom:16px}nav a{display:block;color:inherit;text-decoration:none;border-top:1px solid #cfd5d0;padding:8px 10px}nav a:hover{background:#e2e7e2}nav a[aria-current]{background:#20394b;color:#fff}section{min-height:0;display:flex;flex-direction:column}.stage{position:relative;flex:1;min-height:160px;background:#abbab6}canvas{width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}canvas:active{cursor:grabbing}button{background:#f8f8ee;border:1px solid #8d9d9e;border-radius:2px;padding:5px 12px;cursor:pointer}#rotate{position:absolute;bottom:12px;right:14px}#status{position:absolute;inset:45% 12px auto;text-align:center;pointer-events:none}article{padding:20px 3vw 22px;border-top:1px solid #bbc3c2}#bureau{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;margin:0 0 5px}h2{font-size:clamp(2rem,3vw,3.3rem)}article p{margin:8px 0}#source{font-size:.86rem;color:#23536c}.note{color:#465b61;font-size:.8rem}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b76822;outline-offset:-2px}
@media(max-width:650px){header{height:50px}main{display:flex;flex-direction:column;height:auto}aside{padding:10px 14px;border-right:none;border-bottom:1px solid #abb7b8;display:grid;grid-template-columns:1fr 1fr;gap:0 10px}aside label{min-width:0}nav,#count{grid-column:1/-1}nav{height:100px;padding:0}.stage{flex:auto;height:43dvh}article{padding:16px}h1{font-size:1.5rem}}
</style></head>
<body><header><h1>Police unit directory</h1><a href="./">Back to the game</a></header>
<main><aside><label>Search units<input id="query" type="search" placeholder="Name or assignment"></label><label>Division group<select id="group"><option value="">All groups</option></select></label><p id="count" role="status"></p><nav aria-label="Units" id="units"></nav></aside>
<section aria-labelledby="name"><div class="stage"><canvas id="view" aria-label="Selected unit in its game uniform"></canvas><p id="status" role="status"></p><button id="rotate" type="button" aria-label="Rotate model">Rotate ↻</button></div>
<article><p id="bureau"></p><h2 id="name"></h2><p id="duty"></p><p id="portrayal" class="note"></p><a id="source" target="_blank" rel="noopener">City reference ↗</a></article></section></main>
<script type="module" src="./police-directory.js"></script></body></html>
