   <path d="M24 128l22 38l12-28ZM60 139l20 42l14-36ZM96 146l20 44l16-42ZM134 147l18 42l18-46ZM172 142l10 34l10-44Z"/>
   <path d="M376 128l-22 38l-12-28ZM340 139l-20 42l-14-36ZM304 146l-20 44l-16-42ZM266 147l-18 42l-18-46ZM228 142l-10 34l-10-44Z"/>
   <path d="M52 220l16-34l14 46ZM88 250l16-40l16 50ZM126 264l16-42l18 44ZM166 264l12-38l14 30Z"/>
   <path d="M348 220l-16-34l-14 46ZM312 250l-16-40l-16 50ZM274 264l-16-42l-18 44ZM234 264l-12-38l-14 30Z"/>
  </g>
 </g>
</svg>
