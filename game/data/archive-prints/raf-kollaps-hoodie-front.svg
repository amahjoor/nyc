  </g>
  <g fill="#141416"><path d="M113 130h6v10h-6ZM141 126h3v8h-3ZM146 126h3v8h-3ZM141 138h8v3h-8Z"/></g>
  <text x="135" y="200" font-size="15.5" text-anchor="middle" font-weight="400" font-family="Liberation Sans, Nimbus Sans">we are ready and willing to ignite</text>
  <text x="135" y="226" font-size="25" text-anchor="middle" letter-spacing=".4">JUST BORN TOO LATE</text>
  <text x="135" y="243" font-size="13" text-anchor="middle" letter-spacing=".8">COMPANIONSHIP</text>
  <g font-weight="400" font-family="Liberation Sans, Nimbus Sans" font-size="10.5" text-anchor="middle">
   <text x="135" y="257">everything belongs to us</text>
   <text x="135" y="270">disgusted we are excited, insecure, apprehensive</text>
  </g>
  <text x="142" y="326" font-size="22" letter-spacing=".8">STAND!</text>
  <text x="142" y="360" font-size="33" letter-spacing=".5" stroke="#141416" stroke-width=".8">EVASION</text>
 </g>
