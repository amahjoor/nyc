<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 400">
 <defs><pattern id="ht" width="2.6" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="1.3" cy="1.3" r=".7" fill="#141416"/></pattern></defs>
 <g fill="#141416" font-family="Nimbus Sans Narrow, Liberation Sans Narrow, Liberation Sans" font-weight="700">
  <text x="22" y="26" font-size="19" letter-spacing=".5">#12  "FOREVER FOR NOW"</text>
  <text x="135" y="84" font-size="57" text-anchor="middle" letter-spacing="1" stroke="#141416" stroke-width="1.6">KOLLAPS</text>
  <!-- black disc with a plant of chimneys and tanks in white -->
  <circle cx="135" cy="134" r="38"/>
  <g fill="#ece9df">
   <path d="M104 152h62v-6h-62Z"/>
   <path d="M110 146v-22h12v22ZM126 146v-34h8v34ZM138 146v-26h14v26ZM156 146v-16h8v16Z"/>
   <path d="M128 110v-12h4v12ZM142 118v-8h6v8Z"/>
