<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560">
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="G" yChannelSelector="R"/>
    </filter>
    <radialGradient id="glow" cx="55%" cy="40%" r="70%">
      <stop offset="0" stop-color="#fbf3a8"/><stop offset="0.5" stop-color="#f3d848"/><stop offset="1" stop-color="#eaa722"/>
    </radialGradient>
  </defs>
  <!-- an anonymous solarised face, posterised to three inks on acid yellow: nobody's likeness -->
  <rect width="440" height="560" fill="url(#glow)"/>
  <!-- palm fronds and flowers melting in from the edges -->
  <g filter="url(#rough)">
    <path d="M-20,380 Q40,340 60,420 Q90,500 30,580 H-20 Z" fill="#3d9a4a"/>
    <path d="M400,0 Q470,60 430,150 Q380,110 400,0 Z" fill="#e8651c"/>
    <path d="M380,430 Q470,420 460,520 Q420,580 370,540 Q350,480 380,430 Z" fill="#2aa6b8"/>
    <path d="M-10,-10 H150 Q100,60 40,50 Q10,90 -10,60 Z" fill="#d5438f"/>
    <path d="M330,520 Q380,500 400,560 H320 Z" fill="#6b3fa0"/>
  </g>
  <!-- mid tone: hair, the turned side of the face, the neck -->
  <g fill="#ec8a1c" filter="url(#rough)">
    <path d="M70,60 Q160,-30 300,10 Q400,50 400,170 Q360,90 280,80 Q180,70 130,150 Q100,230 110,330 Q60,250 70,60 Z"/>
    <path d="M110,200 Q90,330 150,440 Q190,500 240,500 Q200,440 180,360 Q160,280 170,200 Z"/>
    <path d="M190,500 Q240,530 300,490 L320,570 H170 Z"/>
    <path d="M310,250 Q350,300 330,380 Q300,340 310,250 Z"/>
  </g>
  <!-- shadow: brows, eyes, the side of the nose, lips, under the jaw, locks of hair -->
  <g fill="#a63a1c" filter="url(#rough2)">
    <path d="M60,90 Q110,10 220,10 Q150,50 120,130 Q95,210 100,300 Q50,220 60,90 Z"/>
    <path d="M330,20 Q410,70 405,200 Q375,120 330,20 Z"/>
    <path d="M128,206 Q165,180 208,200 L206,210 Q165,196 132,216 Z"/>
    <path d="M250,198 Q292,176 336,202 L332,212 Q292,194 252,208 Z"/>
    <path d="M136,236 Q168,214 204,236 Q170,256 136,236 Z"/>
    <path d="M256,234 Q292,212 328,234 Q292,256 256,234 Z"/>
    <path d="M232,220 Q246,290 258,330 Q244,348 222,340 Q236,326 230,300 Q224,260 232,220 Z"/>
    <path d="M196,338 Q210,330 218,342 Q206,350 196,338 Z"/>
    <path d="M150,440 Q200,520 290,480 Q330,450 340,390 Q300,470 230,480 Q180,480 150,440 Z"/>
  </g>
  <g filter="url(#rough2)">
    <path d="M176,392 Q206,372 228,384 Q250,372 284,392 Q250,402 228,398 Q206,402 176,392 Z" fill="#a63a1c"/>
    <path d="M182,398 Q230,440 278,398 Q230,410 182,398 Z" fill="#d5438f"/>
    <circle cx="170" cy="236" r="9" fill="#3a1a12"/><circle cx="292" cy="234" r="9" fill="#3a1a12"/>
    <path d="M150,300 Q170,330 160,360" fill="none" stroke="#fbf3a8" stroke-width="14" opacity="0.7"/>
    <path d="M270,120 Q310,130 330,170" fill="none" stroke="#fbf3a8" stroke-width="18" opacity="0.7"/>
  </g>
</svg>
