<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1000 1000">
  <!-- UV layout of the long-sleeved jacket. The lower centre holds trim for the fitted equipment. -->
  <defs>
    <linearGradient id="cloth" x2=".25" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#394b64"/><stop offset=".45" stop-color="#2d4059"/><stop offset="1" stop-color="#243449"/>
    </linearGradient>
    <linearGradient id="silver" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#eae8d6"/><stop offset=".4" stop-color="#abb1b2"/><stop offset=".52" stop-color="#f8f5dc"/><stop offset="1" stop-color="#989c9d"/>
    </linearGradient>
    <pattern id="weave" width="3" height="3" patternUnits="userSpaceOnUse">
      <path d="M-1 2l3-3M0 4l4-4M2 5l3-3" stroke="#e0e6e8" opacity=".09" stroke-width=".6"/>
      <path d="M0 2.5h1.4" stroke="#091322" opacity=".32" stroke-width=".65"/>
    </pattern>
    <g id="shield">
      <path d="M0 -16l6 3 6 -1 1 12q0 12 -13 18Q-13 10 -13 -2l1 -12 6 1Z" fill="url(#silver)" stroke="#141e2c" stroke-width="2"/>
      <path d="M0 -10l8 2v7Q8 7 0 12Q-8 7 -8 -1v-7Z" fill="none" stroke="#68717b" stroke-width="1"/>
      <path d="M0 -7l1.8 4.2 4.5 .4 -3.4 3 1 4.5L0 3.5l-4 1.6 1 -4.5 -3.4 -3 4.5 -.4Z" fill="#7d8891"/>
      <path d="M-10 -10q10-6 20 0M-7 7q7 4 14 0" fill="none" stroke="#535e68" stroke-width="1.2"/>
      <path d="M-9 -9q9-4 18 0M-10-4v5m20-5v5" fill="none" stroke="#faf8e6" stroke-width="1.1"/>
      <path d="M-5 10h10" stroke="#5b6570"/>
    </g>
    <g id="patch">
      <path d="M-18 -19q18 -9 36 0v17q-1 14 -18 22Q-17 12 -18 -2Z" fill="#152b42" stroke="#c5aa64" stroke-width="2.7"/>
      <path d="M-16 -17q16 -8 32 0v15q-2 13-16 20Q-14 11-16-2Z" fill="none" stroke="#ead18d" stroke-width=".75" stroke-dasharray="1.1 1"/>
      <text x="0" y="-12" text-anchor="middle" font-family="Liberation Sans" font-weight="bold" font-size="7.4" letter-spacing=".25" fill="#f1dda4">POLICE</text>
      <path d="M-11 5h22v3h-22zM-9 4v-8h4v8m1 0v-13h2v-3h2v3h2V4m2 0v-9h4v9" fill="#d9c377"/>
      <text x="0" y="14" text-anchor="middle" font-family="Liberation Sans" font-weight="bold" font-size="6" letter-spacing=".6" fill="#f1dda4">NY</text>
    </g>
    <g id="pocket">
      <path d="M-26 0h52v39l-6 6h-40l-6-6Z" fill="#2d3f54" stroke="#1c2a3a" stroke-width="2"/>
      <path d="M-24 3h48v10L0 19l-24-6Z" fill="#40536a" stroke="#243448" stroke-width="2"/>
      <path d="M-21 20v17l4 4h34l4-4V20" fill="none" stroke="#677381" stroke-width=".9"/>
      <path d="M-22 5v6L0 16.5 22 11V5m-43 17v14l5 4h32l5-4V22" fill="none" stroke="#9aa6af" opacity=".65" stroke-width=".85" stroke-dasharray="1.6 1.5"/>
      <circle cy="13" r="2.5" fill="#141e2b" stroke="#71808f" stroke-width=".8"/><path d="M-1.2 12h2.4" stroke="#a0a8af" stroke-width=".7"/>
    </g>
    <pattern id="webbing" width="44" height="20" patternUnits="userSpaceOnUse">
      <rect width="44" height="20" fill="#373e44"/>
      <path d="M0 1h44" stroke="#50565a" stroke-width="1.8"/><path d="M0 18h44" stroke="#192026" stroke-width="2.8"/>
      <path d="M0 4h44M0 14h44" stroke="#767b7c" stroke-width=".8" stroke-dasharray="2 1.8"/>
      <path d="M2 2v14m2-14v14" stroke="#20282e" stroke-width="1.2"/>
    </pattern>
  </defs>
  <rect width="1000" height="1000" fill="url(#cloth)"/>
  <!-- Shoulder seams, sleeve folds and the two bound waist pockets. -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M441 59q31 17 95 25m49-2q60-7 94-22" stroke="#203148" stroke-width="3"/>
    <path d="M441 61q31 17 95 25m49-2q60-7 94-22" stroke="#526278" stroke-width="1"/>
    <path d="M445 246l41 49m187-50-40 50" stroke="#182739" stroke-width="6"/>
    <path d="M445 244l41 49m187-50-40 50" stroke="#526175" stroke-width="2"/>
    <g stroke="#15263c" opacity=".4" stroke-width="2">
      <path d="M747 258q41 16 84 12m-67 8q24 5 39 14m136-5q22-7 43-6"/>
      <path d="M767 803q39 4 66 18m-48-3q32 2 63 17m75-1q25-12 50-11"/>
    </g>
    <g stroke="#66758a" opacity=".28">
      <path d="M747 260q41 16 84 12m-67 8q24 5 39 14m136-5q22-7 43-6"/>
      <path d="M767 805q39 4 66 18m-48-3q32 2 63 17m75-1q25-12 50-11"/>
    </g>
  </g>
  <!-- Back yoke and embroidered lettering. -->
  <path d="M12 62Q169 112 332 62" fill="none" stroke="#19293c" stroke-width="3"/>
  <path d="M12 65Q169 115 332 65" fill="none" stroke="#536174" stroke-width="1.2"/>
  <rect x="100" y="108" width="139" height="35" rx="3" fill="#1b2b3f" stroke="#5a6774"/>
  <rect x="102.5" y="110.5" width="134" height="30" rx="2" fill="none" stroke="#919aa2" stroke-width=".75" stroke-dasharray="2 1.8"/>
  <text id="unit-lettering" x="169.5" y="135" text-anchor="middle" font-family="Liberation Sans" font-weight="bold" font-size="31" letter-spacing="1.4" fill="#efeede">POLICE</text>
  <!-- Front collar, zipper, angled pocket flaps, shield and radio mic. -->
  <path d="M505 24l55 59 55-59 -19 69 -24 -11 -12 18 -12-18 -25 11Z" fill="#1c2b40" stroke="#596779" stroke-width="1.6"/>
  <path d="M560 87v325" stroke="#1b293a" stroke-width="7"/><path d="M559 91v321" stroke="#778189" stroke-width="1.2" stroke-dasharray="1 1.2"/>
  <use xlink:href="#pocket" transform="translate(513 175)"/><use xlink:href="#pocket" transform="translate(607 175)"/>
  <use xlink:href="#shield" transform="translate(608 141) scale(.94)"/>
  <rect x="497" y="155" width="32" height="5" rx="1" fill="#c2c5bf" stroke="#182635" stroke-width="1"/>
  <text x="513" y="159" text-anchor="middle" font-family="Liberation Sans" font-size="3.8" font-weight="bold" letter-spacing=".6" fill="#38434c">NEW YORK</text>
  <path d="M510 114q-13 18 -9 32t-3 13" fill="none" stroke="#101820" stroke-width="3"/>
  <g transform="translate(509 117) rotate(-12)">
    <rect x="-9" y="-12" width="18" height="24" rx="4" fill="#151e27" stroke="#64707b" stroke-width="1.6"/>
    <path d="M-5-5h10m-10 3h10m-10 3h10m-10 3h10m-10 3h10" stroke="#7c8790" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M-9 -5v7" stroke="#87929b" stroke-width="2"/><circle cx="4" cy="-8.5" r="1" fill="#9dbaa1"/>
  </g>
  <use xlink:href="#patch" transform="translate(813 143) rotate(-9)"/><use xlink:href="#patch" transform="translate(887 679) rotate(9)"/>
  <!-- Swatches for crown, band, peak, hardware, radio and leather pouches. -->
  <path fill="#283952" d="M380 760h32v32h-32z"/><path fill="#101a29" d="M420 760h32v32h-32z"/>
  <path fill="#1b2028" d="M460 760h32v32h-32z"/><path fill="#444d56" d="M500 760h32v32h-32z"/>
  <path fill="#b7babe" d="M540 760h32v32h-32z"/><path fill="#2e343b" d="M580 760h32v32h-32z"/>
  <use xlink:href="#shield" transform="translate(644 775)"/>
  <rect x="380" y="832" width="144" height="36" fill="#222d37"/>
  <rect x="382" y="834" width="140" height="32" rx="2" fill="none" stroke="#77848d" stroke-dasharray="2 2"/>
  <text x="452" y="860" text-anchor="middle" font-family="Liberation Sans" font-size="29" font-weight="bold" letter-spacing="1.5" fill="#efeede">POLICE</text>
  <g transform="translate(380 480)">
    <rect x="-1" y="-1" width="262" height="242" fill="#292f35"/>
    <rect width="260" height="240" fill="url(#weave)" opacity=".65"/>
    <rect x="5" y="5" width="250" height="230" rx="12" fill="none" stroke="#42494e" stroke-width="4"/>
    <rect x="9" y="9" width="242" height="222" rx="9" fill="none" stroke="#72797c" stroke-width="1" stroke-dasharray="2.4 2"/>
    <path d="M16 60h228v20H16zM16 100h228v20H16zM16 140h228v20H16zM16 180h228v20H16z" fill="url(#webbing)"/>
  </g>
</svg>
